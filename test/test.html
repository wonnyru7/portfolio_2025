<script>

    
        function pjw_onStart() {
         
            if (window.csl == undefined) {
                window.csl = new ContentScriptLibrary();r
                window.csl.custom = () => {
                    // custom Event
                }

	
				//첫 화면 자동 스크롤 시작
				document.querySelectorAll('.csl-scroll-start').forEach((item)=>{
				item.classList.add('csl-scroll-on');
				});
				//첫 화면 자동 스크롤 끝
            }
        }
        function pjw_onEnd() {if (window.csl != undefined) {window.removeEventListener("scroll", window.csl.custom );window.removeEventListener("resize", window.csl.custom );window.csl.onEnd();window.csl = undefined;}}
    </script>
    

    
<script>
    function sendHeight() {
        const height = document.documentElement.scrollHeight;
        window.parent.postMessage({ type: 'setHeight', height: height }, '*');
    }
    
    csl.swiper2(1001, 2.2);
    csl.swiper2(101, 1.05);


    // 페이지 로드 시
    window.addEventListener('load', sendHeight);
    
    // DOM 변경 감지
    const observer = new MutationObserver(sendHeight);
    observer.observe(document.body, {
        attributes: true,
        childList: true,
        subtree: true
    });
    
    // 이미지 로드 완료 시
    document.querySelectorAll('img').forEach(img => {
        img.addEventListener('load', sendHeight);
    });
</script>
    


<script>
    window.addEventListener('load', () => {
      const track = document.querySelector('.slider-track');
      const slide = document.querySelector('.slide');
  
      if (!track || !slide) return;
  
      const slideWidth = slide.getBoundingClientRect().width;
  
      setInterval(() => {
        track.style.transition = 'transform 0.5s ease';
        track.style.transform = `translateX(-${slideWidth}px)`;
  
        track.addEventListener('transitionend', () => {
          track.style.transition = 'none';
          track.appendChild(track.firstElementChild);
          track.style.transform = 'translateX(0)';
        }, { once: true });
  
      }, 2500);
    });
  </script>
    
    <script>
        window.addEventListener('load', () => {
          const wrap = document.querySelector('.v-slider-wrap');
          const track = wrap.querySelector('.v-slider-track');
          const slide = wrap.querySelector('.v-slide');
      
          if (!track || !slide) return;
      
          const slideHeight = slide.getBoundingClientRect().height;
      
          setInterval(() => {
            track.style.transition = 'transform 0.6s ease';
            track.style.transform = `translateY(-${slideHeight}px)`;
      
            track.addEventListener('transitionend', () => {
              track.style.transition = 'none';
              track.appendChild(track.firstElementChild);
              track.style.transform = 'translateY(0)';
            }, { once: true });
          }, 2500);
        });
      </script>
